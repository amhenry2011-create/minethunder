pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'CreeperHost'
            url = 'https://maven.creeperhost.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'minethunder'
